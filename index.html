<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>एक बगिया माँ के नाम डैशबोर्ड</title>
<style>
:root{--green:#8ac17c;--gold:#b78600;--yellow:#f7e58b;--orange:#f28250;--blue:#dfeaf8;--border:#7a7a7a;--text:#071b34}
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:var(--text);background:#f4f8fb}.wrap{display:flex;min-height:100vh}.side{width:280px;background:var(--green);border-right:4px solid #008c8c;padding:12px;position:fixed;top:0;bottom:0;overflow:auto}.main{margin-left:280px;width:calc(100% - 280px);background:white;min-height:100vh;border-right:4px solid #008c8c}.ribbon{background:#f9b30d;font-size:28px;font-weight:900;padding:20px 32px;width:520px;clip-path:polygon(0 0,90% 0,100% 50%,90% 100%,0 100%);margin:14px 18px 6px}.ribbon span{display:inline-block;background:#000;color:#fff;padding:6px 12px;border-radius:4px;line-height:1.15}.subtitle{display:none}.devbox{display:inline-block;margin:0 18px 8px;padding:8px 14px;border-radius:16px;background:linear-gradient(135deg,#0b63d1,#2d8cff);border:2px solid #00479a;color:#fff;font-size:15px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.18);animation:pulseBox 1.8s infinite alternate}@keyframes pulseBox{from{transform:scale(1);box-shadow:0 2px 8px rgba(0,0,0,.18)}to{transform:scale(1.015);box-shadow:0 4px 14px rgba(0,80,190,.35)}}.navbtn,.clear,.download{width:100%;padding:14px 8px;margin:8px 0;border:2px solid #9c6a00;border-radius:6px;background:#f28250;font-weight:800;cursor:pointer}.navbtn.active{background:#ffe399}.filter{border-radius:12px;overflow:hidden;margin:12px 0;background:white;border:1px solid #638c4d}.filter label{display:block;background:var(--gold);color:white;font-size:22px;font-weight:900;text-align:center;padding:10px}.filter select,.filter input{width:100%;padding:12px;border:0;border-top:1px solid #ddd;font-size:16px}.hint{margin:8px 18px;padding:12px;background:#fff8d9;border:1px solid #dca800;border-radius:6px;font-size:18px}.section-title{background:var(--yellow);font-size:21px;font-weight:900;text-align:center;padding:8px;margin-top:10px;border-top:1px solid #bca756;border-bottom:1px solid #bca756}.cards{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:10px;padding:10px 14px}.upcard{border:1px solid #777;border-radius:10px;background:white;box-shadow:0 1px 4px #aaa;overflow:hidden;cursor:pointer}.upcard:hover{outline:3px solid #ffa800}.uphead{text-align:center;padding:7px 6px;border-bottom:1px solid #ddd}.upname{font-size:20px;font-weight:900;line-height:1.1}.score{font-size:34px;color:#15930b;font-weight:900;line-height:1}.scorelbl{color:#8b4a00;font-weight:800}.rankline{font-size:12px;color:#36465c;margin-top:4px}.tilegrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:6px}.tile{background:#f5f7fb;border-radius:6px;padding:4px 5px;min-height:36px}.tile b{display:block;font-size:13px;line-height:1.05}.tile span{font-size:9.8px;line-height:1.05;display:block}.tile.rank{background:#dcecff;color:#0047a8}.janpadGroup{grid-column:1/-1;background:#f7e58b;border:1px solid #bca756;padding:7px 12px;font-size:20px;font-weight:900;text-align:center;margin-top:6px}.tile.green{background:#d4f8d0}.tile.warn{background:#fff6bd}.tile.blue{background:#e3efff}.panel{margin:12px 18px;border:1px solid #888;background:white}.scorecards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 10px}.kpi{border:1px solid #777;border-radius:8px;text-align:center;padding:8px 6px;min-height:68px}.kpi b{font-size:24px;color:#5ca51c}.kpi span{display:block;color:#8b4a00;font-weight:800;margin-top:5px;font-size:13px;line-height:1.15}.tablewrap{overflow:auto;max-height:70vh;border-top:1px solid #ccc}table{width:100%;border-collapse:collapse;table-layout:auto}th{position:sticky;top:0;background:#bd9149;color:#0b233e;padding:7px;border:1px solid #d3bd8b;font-size:13px;z-index:2}td{padding:6px;border:1px solid #c9d7ef;font-size:13px;vertical-align:top}tfoot td,.totalrow td{background:#f3c0aa!important;font-weight:900}.hi{background:#c9f3bc}.manday{background:#fff6c5}.mat{background:#e5eefb}.rankcell{background:#21b618!important;color:#001b00;font-weight:900;text-align:center}.hidden{display:none}details{max-width:260px}summary{background:#e6f4ff;border:1px solid #8fc4ed;border-radius:5px;padding:5px;cursor:pointer;font-weight:800}.smalllist{max-height:220px;overflow:auto;margin-top:6px;font-size:12px;padding-left:18px}.titlebar{background:var(--yellow);font-size:21px;font-weight:900;text-align:center;padding:8px;margin-top:10px;border-top:1px solid #bca756;border-bottom:1px solid #bca756;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}.titlebar select{font-size:15px;padding:5px 9px;border:1px solid #9c6a00;border-radius:5px;background:white;font-weight:700}
.toolbar{display:flex;gap:8px;align-items:center;margin:8px 18px;flex-wrap:wrap}.toolbar b{font-size:17px}@media(max-width:1200px){.cards{grid-template-columns:repeat(2,1fr)}.scorecards{grid-template-columns:repeat(2,1fr)}}
@media print{body{background:white}.side{display:none!important}.main{margin:0;width:100%;border:0}.ribbon{margin:0 0 4px 0}.subtitle{margin:0 0 8px 0}.hint{display:none!important}.tablewrap{max-height:none!important;overflow:visible!important}th{position:static}.titlebar{margin-top:0}.scorecards{grid-template-columns:repeat(4,1fr)}.navbtn,.clear,.download,select,input{display:none!important}.cards{grid-template-columns:repeat(2,1fr)} }
</style></head><body><div class="wrap"><aside class="side">
<button class="navbtn active" onclick="showView('rank')">Upyantri Ranking</button><button class="navbtn" onclick="showView('dash')">Upyantri Dashboard</button>
<div class="filter"><label>District</label><select id="zila" onchange="refreshFilters();renderAll()"><option>All</option><option>SATNA</option><option>MAIHAR</option></select></div>
<div class="filter"><label>Janpad</label><select id="janpad" onchange="refreshUpyantri();renderAll()"><option>All Janpad</option></select></div>
<div class="filter"><label>Upyantri</label><select id="upyantri" onchange="renderAll()"><option>All Upyantri</option></select><input id="search" placeholder="Search Upyantri" oninput="renderAll()"></div>
<div class="filter"><label>Expenditure Filter</label><select id="exp" onchange="renderAll()"><option>All expenditure</option><option>0% expenditure</option><option>1-4% expenditure</option><option>5-10% expenditure</option><option>11-20% expenditure</option><option>21-30% expenditure</option><option>&gt;30% expenditure</option></select></div>

<div class="filter"><label>Score Sorting</label><select id="scoresort" onchange="renderAll()"><option value="none">None</option><option value="asc">Ascending</option><option value="desc">Descending</option></select></div>
<div class="filter"><label>Show rows</label><select id="limit" onchange="renderAll()"><option>All</option><option>10</option><option>20</option><option>50</option></select></div>
<button class="clear" onclick="clearFilters()">Clear Filter</button><button class="download" onclick="downloadCSV()">Download CSV</button><button class="download" onclick="makePDF()">Make PDF</button>
</aside><main class="main"><div class="ribbon"><span>एक बगिया माँ के नाम डैशबोर्ड</span></div><div class="devbox">Developed by Hira Mani Dwivedi SRDM ZP SATNA</div>
<div id="rankView"><div class="section-title">Upyantri-wise Target, Achievement, Material Booked and Mandays</div><div class="tablewrap"><table id="rankTable"></table></div></div>
<div id="dashView" class="hidden"><div class="hint">All Upyantri score cards are shown below. Select/click any Upyantri card to see all individual tiles and work details below.</div><div id="cards" class="cards"></div><div id="detail"></div></div>
</main></div><script src="data.js"></script><script>
const rankCols=['Zila','Janpad','Upyantri','Sanction Works','Sanctioned cost(lakhs)','Work achievement score(max 25)','Target wage Amount (lakh)','Total Wage expenditure(lakhs)','Wage expenditure Achievement (max 50)','Target Mat Amount (lakh)','Total material expenditure (lakh)','Material expenditure achievement (max 25)','Average work cost (lakh)','Previous Mandays','Current Mandays','Total Mandays','0 zero mandays work of current year','more than zero mandays work of current year','Material booked previous year (lakh)','Material booked current year (lakh)','Overall Achievement','Upyantri Janpad rank','District Rank'];
let currentView='rank';
function fmt(x){return (typeof x==='number')?x.toLocaleString('en-IN',{maximumFractionDigits:2}):x}
function get(id){return document.getElementById(id).value}
function baseRows(){let z=get('zila'),j=get('janpad'),u=get('upyantri'),q=get('search').toLowerCase();let rows=UPYANTRI_ROWS.filter(r=>(z==='All'||r.Zila===z)&&(j==='All Janpad'||r.Janpad===j)&&(u==='All Upyantri'||r.Upyantri===u)&&(!q||r.Upyantri.toLowerCase().includes(q)));return sortUpyantriRows(rows)}
function scoreSortMode(){let el=document.getElementById('scoresort');return el?el.value:'none'}
function sortUpyantriRows(rows){let mode=scoreSortMode();if(mode==='asc'||mode==='desc'){return rows.slice().sort((a,b)=> mode==='asc' ? ((+a['Total Score (100)']||0)-(+b['Total Score (100)']||0)) : ((+b['Total Score (100)']||0)-(+a['Total Score (100)']||0)));}
const order=['AMARPATAN','MAIHAR','RAMNAGAR','MAJHGAWAN','NAGOD','RAMPUR BAGHELAN','SATNA','UCHEHRA','UNCHAHARA'];return rows.slice().sort((a,b)=>{let ai=order.indexOf(a.Janpad),bi=order.indexOf(b.Janpad);if(ai<0)ai=999;if(bi<0)bi=999;if(ai!==bi)return ai-bi;let ar=+a['Upyantri Janpad rank']||9999,br=+b['Upyantri Janpad rank']||9999;if(ar!==br)return ar-br;return (+b['Total Score (100)']||0)-(+a['Total Score (100)']||0);})}
function totalRow(rows){const sumCols=['Sanction Works','Sanctioned cost(lakhs)','Target wage Amount (lakh)','Total Wage expenditure(lakhs)','Target Mat Amount (lakh)','Total material expenditure (lakh)','Previous Mandays','Current Mandays','Total Mandays','Material booked previous year (lakh)','Material booked current year (lakh)','0 zero mandays work of current year','more than zero mandays work of current year'];let t={'Zila':'Total','Janpad':'','Upyantri':''};sumCols.forEach(c=>t[c]=rows.reduce((a,r)=>a+(+r[c]||0),0));let wt=rows.reduce((a,r)=>a+(+r['Sanction Works']||1),0)||1;['Work achievement score(max 25)','Wage expenditure Achievement (max 50)','Material expenditure achievement (max 25)','Overall Achievement','Total Score (100)'].forEach(c=>{t[c]=rows.reduce((a,r)=>a+(+r[c]||0)*(+r['Sanction Works']||1),0)/wt;});t['Average work cost (lakh)']=t['Sanction Works']?t['Sanctioned cost(lakhs)']/t['Sanction Works']:0;t['Upyantri Janpad rank']='';t['District Rank']='';return t}
function filteredWorks(up){let exp=get('exp');return WORK_DETAILS.filter(w=>(!up||w.Upyantri===up)&&(exp==='All expenditure'||w['Expenditure Bucket']===exp));}
function refreshFilters(){let z=get('zila');let js=[...new Set(UPYANTRI_ROWS.filter(r=>z==='All'||r.Zila===z).map(r=>r.Janpad))].sort();let sel=document.getElementById('janpad');let old=sel.value;sel.innerHTML='<option>All Janpad</option>'+js.map(x=>`<option>${x}</option>`).join('');if(js.includes(old))sel.value=old;refreshUpyantri();}
function refreshUpyantri(){let z=get('zila'),j=get('janpad');let us=[...new Set(UPYANTRI_ROWS.filter(r=>(z==='All'||r.Zila===z)&&(j==='All Janpad'||r.Janpad===j)).map(r=>r.Upyantri))].sort();let sel=document.getElementById('upyantri');let old=sel.value;sel.innerHTML='<option>All Upyantri</option>'+us.map(x=>`<option>${x}</option>`).join('');if(us.includes(old))sel.value=old;}
function showView(v){currentView=v;document.getElementById('rankView').classList.toggle('hidden',v!=='rank');document.getElementById('dashView').classList.toggle('hidden',v!=='dash');document.querySelectorAll('.navbtn').forEach((b,i)=>b.classList.toggle('active',(v==='rank'&&i===0)||(v==='dash'&&i===1)));renderAll();}
function clearFilters(){['zila','janpad','upyantri','exp','scoresort','limit'].forEach(id=>document.getElementById(id).selectedIndex=0);document.getElementById('search').value='';refreshFilters();renderAll();}
function mandayDetails(arr){if(!arr||!arr.length)return '0 works';return `<details><summary>▶ ${arr.length} works</summary><ol class="smalllist">${arr.map(x=>`<li>${x}</li>`).join('')}</ol></details>`}
function renderRank(){let rows=baseRows();let lim=get('limit');if(lim!=='All')rows=rows.slice(0,+lim);let html='<thead><tr>'+rankCols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>';rows.forEach(r=>{html+='<tr>'+rankCols.map(c=>{let cls='';if(c.includes('Achievement'))cls='hi'; if(c.includes('Mandays'))cls='manday'; if(c.includes('Material booked'))cls='mat'; if(c.includes('Rank'))cls='rankcell'; return `<td class="${cls}">${fmt(r[c])}</td>`}).join('')+'</tr>'});let tr=totalRow(rows);html+='</tbody><tfoot><tr>'+rankCols.map((c,i)=>`<td>${i===0?'Total':fmt(tr[c]??'')}</td>`).join('')+'</tr></tfoot>';document.getElementById('rankTable').innerHTML=html;}
function tile(label,val,cls=''){return `<div class="tile ${cls}"><b>${fmt(val)}</b><span>${label}</span></div>`}
function card(r){return `<div class="upcard" onclick="selectUp('${String(r.Upyantri).replace(/'/g,"\'")}')"><div class="uphead"><div class="upname">${r.Upyantri}</div><div class="score">${fmt(r['Total Score (100)'])}</div><div class="scorelbl">Score /100</div><div class="rankline">${r.Janpad} | District Rank: ${r['District Rank']} | Janpad Rank: ${r['Upyantri Janpad rank']}</div></div><div class="tilegrid">${tile('Sanction Works',r['Sanction Works'])}${tile('Sanctioned Cost (Lakh)',r['Sanctioned cost(lakhs)'])}${tile('Work Achievement /25',r['Work achievement score(max 25)'],'green')}${tile('Wage Achievement /50',r['Wage expenditure Achievement (max 50)'],'green')}${tile('Material Achievement /25',r['Material expenditure achievement (max 25)'],'green')}${tile('Overall Achievement',r['Overall Achievement'],'green')}${tile('Target Wage Amount (Lakh)',r['Target wage Amount (lakh)'])}${tile('Total Wage Expenditure (Lakh)',r['Total Wage expenditure(lakhs)'])}${tile('Target Mat Amount (Lakh)',r['Target Mat Amount (lakh)'])}${tile('Total Material Expenditure (Lakh)',r['Total material expenditure (lakh)'])}${tile('Average Work Cost (Lakh)',r['Average work cost (lakh)'])}${tile('Previous Mandays',r['Previous Mandays'],'warn')}${tile('Current Mandays',r['Current Mandays'],'warn')}${tile('Total Mandays',r['Total Mandays'],'warn')}${tile('Current FY 0 Mandays Works',r['0 zero mandays work of current year'],'warn')}${tile('Current FY >0 Mandays Works',r['more than zero mandays work of current year'],'warn')}${tile('Material Booked Previous Year (Lakh)',r['Material booked previous year (lakh)'],'blue')}${tile('Material Booked Current Year (Lakh)',r['Material booked current year (lakh)'],'blue')}</div></div>`}
function renderCards(){let rows=baseRows();let lim=get('limit');if(lim!=='All')rows=rows.slice(0,+lim);let html='',last='';rows.forEach(r=>{if(get('upyantri')==='All Upyantri'&&scoreSortMode()==='none'&&r.Janpad!==last){last=r.Janpad;html+=`<div class="janpadGroup">${last}</div>`}html+=card(r)});document.getElementById('cards').innerHTML=html;let u=get('upyantri'); if(u!=='All Upyantri') renderDetail(u); else document.getElementById('detail').innerHTML='';}
function selectUp(u){document.getElementById('upyantri').value=u;renderAll();document.getElementById('detail').scrollIntoView({behavior:'smooth'});}
function renderDetail(u){let r=UPYANTRI_ROWS.find(x=>x.Upyantri===u); if(!r)return; let exp=get('exp');let works=filteredWorks(u);let total={san:0,wage:0,mat:0,curW:0,curM:0,prevM:0,curMand:0,totalMand:0};works.forEach(w=>{total.san+=+w['Sanction Amount Total']||0;total.wage+=+w['Amount Booked Since Inception Wages']||0;total.mat+=+w['Amount Booked Since Inception Material']||0;total.curW+=+w['Amount Booked Current FY Wages']||0;total.curM+=+w['Amount Booked Current FY Material']||0;total.prevM+=+w['Previous Mandays']||0;total.curMand+=+w['Mandays Generated Current FY']||0;total.totalMand+=+w['Total Mandays']||0;});
let kpis=['Total Score (100)','Work achievement score(max 25)','Wage expenditure Achievement (max 50)','Material expenditure achievement (max 25)','Sanction Works','Sanctioned cost(lakhs)','Previous Mandays','Current Mandays','Total Mandays','Material booked previous year (lakh)','Material booked current year (lakh)'];
let html=`<div class="section-title">${u} - ${r.Janpad} Score Card</div><div class="scorecards">`+kpis.map(k=>`<div class="kpi"><b>${fmt(r[k])}</b><span>${k}</span></div>`).join('')+`</div><div class="titlebar"><span>Selected Upyantri Work Details</span><label>Expenditure Filter: <select onchange="setExpFromDetail(this.value)"><option ${exp==='All expenditure'?'selected':''}>All expenditure</option><option ${exp==='0% expenditure'?'selected':''}>0% expenditure</option><option ${exp==='1-4% expenditure'?'selected':''}>1-4% expenditure</option><option ${exp==='5-10% expenditure'?'selected':''}>5-10% expenditure</option><option ${exp==='11-20% expenditure'?'selected':''}>11-20% expenditure</option><option ${exp==='21-30% expenditure'?'selected':''}>21-30% expenditure</option><option ${exp==='>30% expenditure'?'selected':''}>&gt;30% expenditure</option></select></label></div><div class="tablewrap"><table><thead><tr><th>Work Code</th><th>Work Name</th><th>Panchayat</th><th>Sanction Amount Total</th><th>Booked Wages</th><th>Booked Material</th><th>Current FY Wages</th><th>Current FY Material</th><th>Previous Mandays</th><th>Current Mandays</th><th>Total Mandays</th><th>Overall Expenditure %</th><th>Expenditure Bucket</th></tr></thead><tbody>`;
works.forEach(w=>{html+=`<tr><td>${w['Work Code']}</td><td>${w['Work Name']}</td><td>${w['Panchayat Name']}</td><td>${fmt(w['Sanction Amount Total'])}</td><td>${fmt(w['Amount Booked Since Inception Wages'])}</td><td>${fmt(w['Amount Booked Since Inception Material'])}</td><td>${fmt(w['Amount Booked Current FY Wages'])}</td><td>${fmt(w['Amount Booked Current FY Material'])}</td><td>${fmt(w['Previous Mandays'])}</td><td>${fmt(w['Mandays Generated Current FY'])}</td><td>${fmt(w['Total Mandays'])}</td><td>${fmt(w['Overall Expenditure %'])}</td><td>${w['Expenditure Bucket']}</td></tr>`});
html+=`</tbody><tfoot><tr><td colspan="3">Total</td><td>${fmt(total.san)}</td><td>${fmt(total.wage)}</td><td>${fmt(total.mat)}</td><td>${fmt(total.curW)}</td><td>${fmt(total.curM)}</td><td>${fmt(total.prevM)}</td><td>${fmt(total.curMand)}</td><td>${fmt(total.totalMand)}</td><td colspan="2">${works.length} works</td></tr></tfoot></table></div>`;document.getElementById('detail').innerHTML=html;}
function setExpFromDetail(v){document.getElementById('exp').value=v;renderAll();setTimeout(()=>document.getElementById('detail')?.scrollIntoView({behavior:'smooth'}),0)}
function renderAll(){if(currentView==='rank')renderRank();else renderCards();}
function makePDF(){renderAll();setTimeout(()=>window.print(),150)}
function downloadCSV(){let rows=baseRows();let csv=[rankCols.join(',')].concat(rows.map(r=>rankCols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='upyantri_dashboard.csv';a.click();}
refreshFilters();renderAll();</script></body></html>
