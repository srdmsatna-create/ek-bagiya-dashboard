<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - एक बगिया माँ के नाम डैशबोर्ड</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,'Noto Sans Devanagari',sans-serif;background:linear-gradient(135deg,#8ac17c,#e9f7e5);display:flex;align-items:center;justify-content:center;color:#071b34}
.card{width:min(430px,92vw);background:#fff;border:4px solid #008c8c;border-radius:18px;box-shadow:0 18px 45px rgba(0,0,0,.25);overflow:hidden}
.head{background:#f9b30d;padding:22px 26px;text-align:center}
.title{display:inline-block;background:#000;color:#fff;font-size:25px;font-weight:900;padding:10px 14px;border-radius:8px;line-height:1.2}
.dev{margin:14px auto 0;display:inline-block;background:linear-gradient(135deg,#0b63d1,#2d8cff);color:#fff;padding:8px 12px;border-radius:18px;font-weight:800;font-size:13px}
.form{padding:24px}
label{display:block;font-weight:800;margin:12px 0 6px;color:#8b4a00}
input{width:100%;padding:13px;border:1px solid #bdbdbd;border-radius:9px;font-size:16px}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#f28250;color:#111;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 2px 0 #9c6a00}
button:hover{filter:brightness(.98)}
.err{display:none;margin-top:14px;padding:10px;border-radius:8px;background:#ffe2e2;color:#9b0000;font-weight:800;text-align:center}
.note{margin-top:14px;font-size:12px;color:#526070;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="title">एक बगिया माँ के नाम डैशबोर्ड</div>
    <div class="dev">Developed by Hira Mani Dwivedi SRDM ZP SATNA</div>
  </div>
  <form class="form" onsubmit="return login(event)">
    <label>Username</label>
    <input id="user" autocomplete="username" autofocus>
    <label>Password</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button type="submit">Login</button>
    <div id="err" class="err">Invalid username or password</div>
    <div class="note">Authorized access only</div>
  </form>
</div>
<script>
if (sessionStorage.getItem('ekBagiyaAuth') === 'ok') window.location.replace('dashboard.html');
function login(e){
  e.preventDefault();
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value;
  if(u==='zpsatna' && p==='hira@1234'){
    sessionStorage.setItem('ekBagiyaAuth','ok');
    window.location.replace('dashboard.html');
  } else {
    document.getElementById('err').style.display='block';
    document.getElementById('pass').value='';
  }
  return false;
}
</script>
</body>
</html>
